[program:reel-maker]
# Port 8100, NOT 8091: the Screen's neko video server binds 127.0.0.1:8091, and an app
# holding it keeps the Screen (and the browser on it) from starting.
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project .external_worktrees/reel-maker && uv sync --locked --project .external_worktrees/reel-maker && python3 system/scripts/forward_port.py --manifest .external_worktrees/reel-maker/app.toml --url http://localhost:8100 && exec .external_worktrees/reel-maker/.venv/bin/reel-maker"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/reel-maker-stdout.log
stderr_logfile=/var/log/supervisor/reel-maker-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
